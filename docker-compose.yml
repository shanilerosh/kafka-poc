# A real 3-broker Kafka cluster running in KRaft mode (no ZooKeeper).
# Every broker is also a "controller" (they elect a leader among themselves via Raft).
#
#   Apps on your laptop connect via:  localhost:9092, localhost:9094, localhost:9096   (EXTERNAL listener)
#   Brokers talk to each other via:   kafka-N:19092                                    (INTERNAL listener)
#   Controllers talk via:             kafka-N:9093                                     (CONTROLLER listener)
x-kafka-common: &kafka-common
  image: apache/kafka:3.9.0
  environment: &kafka-env
    CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"           # same on every node; identifies the cluster
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
    # Topics are created explicitly by the app (see TopicsConfig). Auto-creation hides typos in production.
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_NUM_PARTITIONS: 3
    # Internal topics (__consumer_offsets, __transaction_state) must be replicated too.
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

services:
  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    ports: ["9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://localhost:9092

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    ports: ["9094:9094"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:9094

  kafka-3:
    <<: *kafka-common
    container_name: kafka-3
    ports: ["9096:9096"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9096
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://localhost:9096

  # Web UI to *see* topics, partitions, messages, consumer groups and lag: http://localhost:8085
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports: ["8085:8080"]
    depends_on: [kafka-1, kafka-2, kafka-3]
    environment:
      KAFKA_CLUSTERS_0_NAME: rideflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
